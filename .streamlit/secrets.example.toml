# Example secrets for the Streamlit app. Copy it and fill in your own values:
#   cp .streamlit/secrets.example.toml .streamlit/secrets.toml
# .streamlit/secrets.toml is git-ignored and docker-ignored; never commit it.
# Environment variables take precedence over .streamlit/secrets.toml.
# Empty values fall back to the environment, then to the built-in defaults.

[openai]
# Required unless OPENAI_API_KEY is set.
api_key = ""

[model]
# Defaults: provider "openai" (the only one supported), model_id "gpt-4o".
provider = ""
model_id = ""

[sql_guard]
# Defaults: 50000000 VM steps, 10000 rows, 5.0 s backstop.
step_budget = ""
row_cap = ""
timeout_s = ""

[api]
# Browser origins allowed to call the JSON-RPC API. Default: localhost only.
cors_origins = []

[audit]
# Required for the audit log on any database other than the bundled
# chinook.db (the audit log lands in a later commit). Generate one with:
#   python -c "import secrets; print(secrets.token_hex(32))"
hmac_key = ""
