# Example secrets for the Streamlit app. Copy it and fill in your own values:
#   cp .streamlit/secrets.example.toml .streamlit/secrets.toml
# .streamlit/secrets.toml is git-ignored and docker-ignored; never commit it.
# Environment variables take precedence over .streamlit/secrets.toml.
# Empty values fall back to the environment, then to the built-in defaults.

[openai]
# Required unless OPENAI_API_KEY is set.
api_key = ""

[model]
# Defaults: provider "openai" (the only one supported), model_id "gpt-4o".
provider = ""
model_id = ""

[sql_guard]
# Defaults: 50000000 VM steps, 10000 rows, 5.0 s backstop.
step_budget = ""
row_cap = ""
timeout_s = ""

[api]
# Browser origins allowed to call the JSON-RPC API. Default: localhost only.
cors_origins = []

[audit]
# Per-install key for the audit log's keyed hashes (HMAC-SHA256) of each
# question and SQL; at least 32 bytes. ADQ_AUDIT_HMAC_KEY takes precedence.
# Required for any database other than the bundled chinook.db, which is
# recognized by its sha256: without a key, chinook.db logs outcomes only
# (no question or SQL fields) and any other database refuses to start.
# Generate one with:
#   python -c "import secrets; print(secrets.token_hex(32))"
# Raw-text logging (ADQ_AUDIT_RAW_TEXT=1 or raw_text = true here) works only
# with the bundled chinook.db.
hmac_key = ""
