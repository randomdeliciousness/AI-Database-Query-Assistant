name: CI/CD Pipeline

on: [push, pull_request]

# Read-only token: CI checks the code and never writes back to the repo.
permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      # Tests never call a real model or the network (OpenAI and Chroma are mocked).
      OPENAI_API_KEY: ""
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_OFFLINE: "1"
      # Full checkout: the .git-dependent claims test must run here, never skip.
      ADQ_REQUIRE_GIT: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Verify committed Chinook DB
        run: |
          echo "7651ba378ac2fcd0dfc3c66fb101f7a7eed3ba39a612ec642b96e20702061f15  chinook.db" | sha256sum --check --strict

      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.lock -r requirements-ci.lock
          python -m pip check

      - name: Show SQLite version
        run: python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Lint (check only)
        run: |
          ruff check .
          black --check .

      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ --verbose -rs --cov=enhanced_assistant --cov=sql_guard --cov=audit_log --cov-report=term --cov-fail-under=0

  # ADQ-1b-R: build the pinned image on GitHub's runner (Policy route 2; never
  # built locally) and run the full test suite inside it with no network and
  # no keys. Nothing is pushed and no registry login is used.
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --target runtime -t adq:ci .

      - name: Build test image
        run: docker build --target test -t adq:ci-test .

      - name: Record base image digest
        run: docker image inspect python:3.13.5-slim --format '{{index .RepoDigests 0}}'

      - name: Record base image os-release
        run: docker run --rm python:3.13.5-slim cat /etc/os-release

      - name: Record base image Debian license inventory
        run: |
          docker run --rm python:3.13.5-slim sh -c 'ls /usr/share/doc/*/copyright | wc -l; grep -l -i -E "GNU AFFERO|AGPL" /usr/share/doc/*/copyright || true'

      - name: Runtime image has no tests
        run: docker run --rm --network none adq:ci sh -c 'test ! -e /app/tests'

      - name: Run tests in the test image (no network, no keys)
        run: |
          docker run --rm --network none \
            -e ANONYMIZED_TELEMETRY=False -e HF_HUB_OFFLINE=1 \
            adq:ci-test python -m pytest tests/ -q -p no:cacheprovider
