name: CI/CD Pipeline

on: [push, pull_request]

# Read-only token: CI checks the code and never writes back to the repo.
permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    env:
      # Tests never call a real model or the network (OpenAI and Chroma are mocked).
      OPENAI_API_KEY: ""
      ANONYMIZED_TELEMETRY: "False"
      HF_HUB_OFFLINE: "1"
      # Full checkout: the .git-dependent claims test must run here, never skip.
      ADQ_REQUIRE_GIT: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Verify committed Chinook DB
        run: |
          echo "7651ba378ac2fcd0dfc3c66fb101f7a7eed3ba39a612ec642b96e20702061f15  chinook.db" | sha256sum --check --strict

      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements.lock -r requirements-ci.lock
          python -m pip check

      - name: Show SQLite version
        run: python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Lint (check only)
        run: |
          ruff check .
          black --check .

      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ --verbose -rs --cov=enhanced_assistant --cov=sql_guard --cov=audit_log --cov-report=term --cov-fail-under=0

  # ADQ-1b-R: build the pinned image on GitHub's runner (Policy route 2; never
  # built locally) and run the full test suite inside it with no network and
  # no keys. Nothing is pushed and no registry login is used.
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --target runtime -t adq:ci .

      - name: Build test image
        run: docker build --target test -t adq:ci-test .

      # BuildKit keeps the base image in its own cache, so pull it into the
      # local store by the digest from the build log (not the movable tag).
      - name: Pull base image by digest
        run: docker pull python:3.13.5-slim@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419

      - name: Record base image digest
        run: docker image inspect python:3.13.5-slim@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419 --format '{{index .RepoDigests 0}}'

      - name: Record base image os-release
        run: docker run --rm --network none python:3.13.5-slim@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419 cat /etc/os-release

      - name: Record base image Debian license inventory
        run: |
          docker run --rm --network none python:3.13.5-slim@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419 sh -c '
            echo "copyright files:"; ls /usr/share/doc/*/copyright | wc -l
            echo "AGPL hits:"; grep -l -i -E "GNU AFFERO|AGPL" /usr/share/doc/*/copyright || true
            echo "License lines (count, name):"; grep -h "^License:" /usr/share/doc/*/copyright | sed "s/[[:space:]]*$//" | sort | uniq -c | sort -rn
            echo "Copyright files with no License: line (read by hand):"; grep -L "^License:" /usr/share/doc/*/copyright || true
          '

      - name: Runtime image has no tests
        run: docker run --rm --network none adq:ci sh -c 'test ! -e /app/tests'

      - name: Run tests in the test image (no network, no keys)
        run: |
          docker run --rm --network none \
            -e ANONYMIZED_TELEMETRY=False -e HF_HUB_OFFLINE=1 \
            adq:ci-test python -m pytest tests/ -q -p no:cacheprovider

      # ADQ-11: both containers, no network, one read-only query while the
      # generator is writing. Local image only. Throwaway key, not a repo secret.
      - name: Query the clinic file while the generator writes
        run: |
          KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          export ADQ_AUDIT_HMAC_KEY="$KEY"
          docker compose -f compose.yaml -f - up -d --no-build --force-recreate <<'YAML'
          services:
            generator:
              image: adq:ci
              network_mode: none
              pull_policy: never
            app:
              image: adq:ci
              network_mode: none
              pull_policy: never
              ports: !override []
          YAML
          docker compose ps --status running --services | grep -qx generator
          docker compose ps --status running --services | grep -qx app
          docker compose exec -T app python - <<'PY'
          import os
          import time
          from audit_log import load_audit_config
          from clinic_schema import PLANTED_CASES
          from sql_guard import run_readonly_query

          path = "/data/clinic.db"
          case = next(c for c in PLANTED_CASES if c.id == "vaccine_not_billed")
          deadline = time.time() + 60
          while time.time() < deadline:
              if os.path.exists(path):
                  try:
                      if load_audit_config(path).mode == "keyed_hash":
                          break
                  except Exception:
                      pass
              time.sleep(0.2)
          else:
              raise SystemExit("generator did not commit a readable clinic file")
          columns, rows, truncated = run_readonly_query(path, case.sql)
          if list(rows) != list(case.expected_rows) or truncated:
              raise SystemExit(f"vaccine query rows={rows!r} truncated={truncated}")
          PY
          docker compose ps --status running --services | grep -qx generator
          docker compose down --volumes
